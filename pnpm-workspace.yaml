catalogMode: 'strict'

minimumReleaseAgeExclude:
  - turbo
  - '@turbo/darwin-64'
  - '@turbo/darwin-arm64'
  - '@turbo/linux-64'
  - '@turbo/linux-arm64'
  - '@turbo/windows-64'
  - '@turbo/windows-arm64'

packages:
  - 'instance/services/*'
  - 'instance/packages/*'
  - 'portal/services/*'
  - 'portal/packages/*'
  - 'shared/*'
  - 'studio/*'
  - 'tools/*'
  - 'docs'

catalog:
  '@types/node': '^26.6.6'
  'typescript': '^7.0.2'
  'tsx': '^4.23.15'
  'rimraf': '^6.1.4'
  'turbo': '2.11.11'
  'kill-port': '^2.0.1'
  'husky': '^9.1.7'
  'lint-staged': '^17.6.1'
  'glob': '^14.0.6'
  '@types/glob': '^8.1.0'
  '@aws-sdk/client-s3': '^3.1169.0'
  '@smithy/node-http-handler': '^4.14.2'
  'mime-types': '^3.0.2'
  '@types/mime-types': '^3.0.1'
  '@clack/prompts': '^1.9.0'
  '@changesets/cli': ^3.0.3
  'wrangler': '^4.162.0'

catalogs:
  tooling-stack:
    '@eslint/compat': '2.1.1'
    '@eslint/js': '10.0.1'
    '@typescript-eslint/eslint-plugin': '8.72.2'
    'eslint': '10.15.0'
    'eslint-import-resolver-typescript': '4.4.5'
    'eslint-plugin-import': '^2.32.0'
    'eslint-plugin-mdx': '3.10.1'
    'eslint-plugin-prettier': '^5.5.7'
    'eslint-config-prettier': '^10.0.1'
    'prettier': '3.10.1'
    'typescript-eslint': '8.72.2'

  shared-stack:
    'zod': '^4.6.7'
    'dotenv': '^18.0.10'
    'date-fns': '^4.1.0'
    'axios': '^1.21.1'
    '@react-three/fiber': '9.8.2'
    '@react-three/drei': '10.7.9'
    'three': '0.187.0'
    '@types/three': '0.187.0'
    'three-stdlib': '2.36.1'
    'tailwindcss': '^4.3.5'

  web-stack:
    # Dependencies
    '@gsap/react': '^2.1.2'
    'gsap': '^3.15.1'
    'react': '^19.3.1'
    'react-dom': '^19.3.1'
    'react-i18next': '^18.0.1'
    'i18next': '^27.1.2'
    'react-datepicker': '^9.1.0'
    'zustand': '^5.1.0'
    '@marsidev/react-turnstile': '^1.6.3'
    # Dev Dependencies
    '@vitejs/plugin-react-swc': '^4.3.3'
    '@tailwindcss/vite': '^4.3.5'
    '@types/react': '^19.3.0'
    '@types/react-dom': '^19.3.0'
    'vite': '^8.3.8'
    'eslint-plugin-react': '^7.37.5'
    'eslint-plugin-react-hooks': '^7.1.1'
    'eslint-plugin-react-refresh': '^0.5.8'
    'vite-plugin-svgr': '^5.2.0'
    '@tailwindcss/postcss': '^4.3.5'

  docs-stack:
    '@docusaurus/core': '3.10.2'
    '@docusaurus/faster': '3.10.2'
    '@docusaurus/preset-classic': '3.10.2'
    '@docusaurus/theme-live-codeblock': '3.10.2'
    '@docusaurus/theme-mermaid': '3.10.2'
    '@mdx-js/react': '^3.0.0'
    'clsx': '^2.0.0'
    'prism-react-renderer': '^2.3.0'
    '@docusaurus/module-type-aliases': '3.10.2'
    '@docusaurus/tsconfig': '3.10.2'
    '@docusaurus/types': '3.10.2'
    # Core plugin/theme packages needed for custom local preset
    '@docusaurus/plugin-content-docs': '3.10.2'
    '@docusaurus/plugin-content-blog': '3.10.2'
    '@docusaurus/plugin-content-pages': '3.10.2'
    '@docusaurus/plugin-debug': '3.10.2'
    '@docusaurus/plugin-google-gtag': '3.10.2'
    '@docusaurus/plugin-google-tag-manager': '3.10.2'
    '@docusaurus/plugin-sitemap': '3.10.2'
    '@docusaurus/plugin-svgr': '3.10.2'
    '@docusaurus/plugin-css-cascade-layers': '3.10.2'
    '@docusaurus/theme-classic': '3.10.2'
    '@docusaurus/theme-search-algolia': '3.10.2'
    '@docusaurus/theme-common': '3.10.2'

  api-stack:
    # Dependencies
    '@fastify/cookie': '^11.1.5'
    '@fastify/cors': '^11.4.3'
    '@fastify/csrf-protection': '^8.0.2'
    '@fastify/env': '^7.0.1'
    '@fastify/http-proxy': '^11.6.9'
    '@fastify/jwt': '^10.2.8'
    '@fastify/one-line-logger': '^2.2.1'
    '@fastify/rate-limit': '^11.2.2'
    '@fastify/session': '^11.1.6'
    '@fastify/sse': '^0.6.1'
    '@sentry/node': '^11.12.0'
    '@sentry/profiling-node': '^11.12.0'
    'bcrypt': '^6.0.0'
    'bullmq': '^6.7.6'
    'fastify': '^5.12.8'
    'fastify-metrics': '^15.0.1'
    'fastify-plugin': '^6.0.1'
    'fastify-type-provider-zod': '^7.0.0'
    'ioredis': '6.0.0'
    'mongoose': '^9.12.1'
    'pino-roll': '^4.0.0'
    'sdk-node-apis-efi': '^2.0.1'
    # Dev Dependencies
    '@types/bcrypt': '^6.0.0'

  studio-stack:
    '@fontsource-variable/nunito': '^5.3.0'
    'react-icons': '^5.5.0'

allowBuilds:
  '@sentry-internal/node-cpu-profiler': true
  '@sentry/node-cpu-profiler': true
  '@swc/core': true
  'bcrypt': true
  'core-js': true
  'esbuild': true
  'msgpackr-extract': true
  'sharp': true
  'unrs-resolver': true
  'workerd': true
